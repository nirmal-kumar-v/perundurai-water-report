<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Water Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #003A7A; --secondary: #FF8C00; }
        body { background: linear-gradient(135deg, var(--primary) 0%, #005ba8 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
        .navbar { background-color: var(--primary); }
        .login-container { background: white; border-radius: 15px; box-shadow: 0 15px 50px rgba(0,0,0,0.2); padding: 40px; max-width: 450px; width: 100%; margin: 20px; }
        .login-container h2 { color: var(--primary); font-weight: 700; text-align: center; margin-bottom: 10px; }
        .login-container .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 0.9rem; }
        .form-group { margin-bottom: 20px; }
        label { font-weight: 600; color: #333; }
        .form-control { border-radius: 8px; border: 1px solid #ddd; padding: 12px 15px; }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 0.2rem rgba(0, 58, 122, 0.25); }
        .btn-login { background-color: var(--primary); color: white; border: none; padding: 12px 30px; font-weight: 600; width: 100%; }
        .btn-login:hover { background-color: #002d5f; }
        .error-message { color: #DC3545; font-size: 0.9rem; margin: 10px 0; display: none; }
        .error-message.show { display: block; }
        .info-box { background-color: #fff3cd; border-left: 4px solid var(--secondary); padding: 15px; margin-bottom: 20px; border-radius: 8px; }
        .navbar-brand { color: white !important; font-weight: 700; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="fas fa-water"></i> Water Portal</a>
        </div>
    </nav>

    <div class="login-container">
        <h2><i class="fas fa-shield-alt"></i> Admin Portal</h2>
        <p class="subtitle">Administrator Access - Default Credentials</p>

        <div class="info-box">
            <strong>Demo Credentials:</strong><br>
            Username: <code>admin</code><br>
            Password: <code>admin123</code>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" class="form-control" id="username" placeholder="admin">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" class="form-control" id="password" placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-login">Login as Admin</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('errorMessage');

            if (username === 'admin' && password === 'admin123') {
                localStorage.setItem('currentSession', JSON.stringify({
                    userType: 'admin',
                    adminId: 'ADMIN-001',
                    adminName: 'Administrator',
                    loginTime: new Date().toISOString()
                }));
                window.location.href = 'admin-dashboard.html';
            } else {
                errorEl.textContent = 'Invalid username or password';
                errorEl.classList.add('show');
            }
        });
    </script>
</body>
</html>
