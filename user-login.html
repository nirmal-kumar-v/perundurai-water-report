<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login - Perundurai Water Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #003A7A; --secondary: #FF8C00; }
        body {
            background: linear-gradient(135deg, var(--primary) 0%, #005ba8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
        }
        .navbar { background-color: var(--primary); position: fixed; top: 0; width: 100%; z-index: 1000; }
        body { padding-top: 70px; }
        .login-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.2);
            padding: 40px;
            max-width: 450px;
            width: 100%;
            margin: 20px;
        }
        .login-container h2 { color: var(--primary); font-weight: 700; text-align: center; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { font-weight: 600; color: #333; }
        .form-control { border-radius: 8px; border: 1px solid #ddd; padding: 12px 15px; }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 0.2rem rgba(0, 58, 122, 0.25); }
        .btn-login { background-color: var(--primary); color: white; border: none; padding: 12px 30px; font-weight: 600; width: 100%; }
        .btn-login:hover { background-color: #002d5f; color: white; }
        .error-message { color: #DC3545; font-size: 0.9rem; margin-top: 10px; display: none; }
        .error-message.show { display: block; }
        .info-box { background-color: #e3f2fd; border-left: 4px solid var(--primary); padding: 15px; margin-bottom: 20px; }
        .register-link { text-align: center; margin-top: 20px; }
        .register-link a { color: var(--primary); font-weight: 600; }
        .navbar-brand { color: white !important; font-weight: 700; font-size: 1.3rem; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="fas fa-water"></i> Water Portal</a>
        </div>
    </nav>

    <div class="login-container">
        <h2><i class="fas fa-sign-in-alt"></i> User Login</h2>

        <div class="info-box">
            <strong>Demo Credentials:</strong><br>
            Email: user1@gmail.com<br>
            Password: user1@123
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email or Aadhaar</label>
                <input type="text" class="form-control" id="email" placeholder="user1@gmail.com or 12-digit Aadhaar">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" class="form-control" id="password" placeholder="••••••••">
            </div>

            <div class="form-group">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">Remember me</label>
                </div>
            </div>

            <button type="submit" class="btn btn-login">Login</button>
        </form>

        <div class="register-link">
            Don't have an account? <a href="user-register.html">Register here</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Initialize demo user on first visit
        function initializeDemoData() {
            let users = JSON.parse(localStorage.getItem('users')) || [];
            if (!users.some(u => u.email === 'user1@gmail.com')) {
                users.push({
                    id: 'USER-DEMO-001',
                    aadhaar: '123456789012',
                    name: 'Demo User',
                    email: 'user1@gmail.com',
                    phone: '9876543210',
                    email: 'user1@gmail.com',
                    address: 'Demo Address, Ward 5',
                    ward: 'Ward 5 - Kasilingam Palayam',
                    password: 'user1@123',
                    verified: true
                });
                localStorage.setItem('users', JSON.stringify(users));
            }
        }

        initializeDemoData();

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const errorEl = document.getElementById('errorMessage');
            errorEl.classList.remove('show');

            const emailInput = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!emailInput || !password) {
                errorEl.textContent = 'Please fill all fields';
                errorEl.classList.add('show');
                return;
            }

            let users = JSON.parse(localStorage.getItem('users')) || [];
            let user = users.find(u => 
                (u.email === emailInput || u.aadhaar === emailInput) && u.password === password
            );

            if (!user) {
                errorEl.textContent = 'Invalid email/aadhaar or password';
                errorEl.classList.add('show');
                return;
            }

            // Store current session
            localStorage.setItem('currentSession', JSON.stringify({
                userType: 'user',
                userId: user.id,
                userName: user.name,
                loginTime: new Date().toISOString()
            }));

            if (document.getElementById('rememberMe').checked) {
                localStorage.setItem('rememberMe', 'true');
            }

            window.location.href = 'user-dashboard.html';
        });
    </script>
</body>
</html>
